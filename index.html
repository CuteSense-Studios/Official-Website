<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuteSense Studios | Emotive Open Source Art</title>

    <link rel="icon" type="image/webp" href="./assets/icons/companylogo.webp">
    <link rel="stylesheet" href="./assets/css/cursor.css">
    <link rel="stylesheet" href="./assets/css/tailwind.css">
    
    <script src="./assets/js/lucide.min.js"></script>
    
    <script>
        // Immediate Theme Check
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDhJiNnmHxmLmRzRrjfeu5mhSfmAjMFHH0",
            authDomain: "cutesense-studios.firebaseapp.com",
            databaseURL: "https://cutesense-studios-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "cutesense-studios",
            storageBucket: "cutesense-studios.firebasestorage.app",
            messagingSenderId: "847619766993",
            appId: "1:847619766993:web:bde44be73b3732fe24e3f0",
            measurementId: "G-64LY73VLMW"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'cutesense-studios';

        let unsubscribeSignatures = null;

        const initAuth = async () => {
            try {
                await signInAnonymously(auth);
            } catch (err) {
                console.error("Auth failed:", err);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadSignatures();
            } else if (unsubscribeSignatures) {
                unsubscribeSignatures();
                unsubscribeSignatures = null;
            }
        });

        initAuth();

        async function signWall(e) {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) return;
            
            const nameInput = document.getElementById('signer-name');
            const name = nameInput.value.trim() || "Anonymous Friend";
            const submitBtn = e.target.querySelector('button');
            const status = document.getElementById('form-status');
            
            try {
                submitBtn.disabled = true;
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'signatures'), {
                    name: name,
                    timestamp: serverTimestamp(),
                    uid: user.uid
                });
                nameInput.value = '';
                status.innerText = "Signed successfully! ✨";
                setTimeout(() => status.innerText = '', 3000);
            } catch (err) {
                status.innerText = "Error signing. Try again!";
            } finally {
                submitBtn.disabled = false;
            }
        }

        function loadSignatures() {
            if (!auth.currentUser) return;
            if (unsubscribeSignatures) unsubscribeSignatures();

            const signaturesRef = collection(db, 'artifacts', appId, 'public', 'data', 'signatures');
            unsubscribeSignatures = onSnapshot(signaturesRef, (snapshot) => {
                const signatures = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.name) signatures.push(data);
                });
                
                signatures.sort((a, b) => {
                    const timeA = a.timestamp?.toMillis() || Date.now();
                    const timeB = b.timestamp?.toMillis() || Date.now();
                    return timeB - timeA;
                });
                
                const countEl = document.getElementById('signature-count');
                if (countEl) countEl.innerText = signatures.length;
                
                const list = document.getElementById('signature-list');
                if (list) {
                    const brandThemes = [
                        'border-cs-pink bg-cs-pink/10 text-[#D87D85] dark:text-cs-pink dark:border-cs-pink',
                        'border-cs-blue bg-cs-blue/10 text-[#599AB5] dark:text-cs-blue dark:border-cs-blue',
                        'border-cs-lilac bg-cs-lilac/10 text-cs-lilac dark:text-[#E2CBEB] dark:border-cs-lilac'
                    ];

                    list.innerHTML = signatures.slice(0, 24).map(s => {
                        const theme = brandThemes[Math.floor(Math.random() * brandThemes.length)];
                        
                        return `
                            <div class="px-5 py-2.5 rounded-full text-sm border-2 shadow-sm animate-in fade-in slide-in-from-bottom-2 duration-500 font-bold whitespace-nowrap transition-all ${theme}">
                                ✨ ${escapeHtml(s.name)}
                            </div>
                        `;
                    }).join('') || '<p class="text-slate-400 italic">Be the first to leave a mark!</p>';
                }
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        window.signWall = signWall;
    </script>

    <style>
        /* Fonts */
        @font-face { font-family: 'Fredoka'; src: url('./assets/fonts/fredoka-v17-latin/fredoka-v17-latin-300.woff2') format('woff2'); font-weight: 300; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Fredoka'; src: url('./assets/fonts/fredoka-v17-latin/fredoka-v17-latin-regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Fredoka'; src: url('./assets/fonts/fredoka-v17-latin/fredoka-v17-latin-700.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }
        @font-face { font-family: 'Quicksand'; src: url('./assets/fonts/quicksand-v37-latin/quicksand-v37-latin-regular.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }

        body { font-family: 'Quicksand', sans-serif; transition: background-color 0.4s ease, color 0.4s ease; }
        h1, h2, h3, .cute-font { font-family: 'Fredoka', sans-serif; }

        .gradient-text {
            background: linear-gradient(90deg, #F08DA1 0%, #7CB9D4 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .floating { animation: floating 4s ease-in-out infinite; }
        @keyframes floating { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }

        .sparkle-slow { animation: sparkle-pulse 3s infinite ease-in-out; pointer-events: none; }
        @keyframes sparkle-pulse { 0%, 100% { opacity: 0.6; transform: scale(0.8) rotate(0deg); } 50% { opacity: 1; transform: scale(1.1) rotate(15deg); } }

        .motto-wrapper { min-height: 180px; display: flex; align-items: center; justify-content: center; }
        #motto-container { transition: all 0.5s ease-in-out; color: #A178AF; }
        #mobile-menu { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); transform: translateX(100%); }
        #mobile-menu.active { transform: translateX(0); }
        .signature-list-container { mask-image: linear-gradient(to bottom, black 85%, transparent 100%); }
        .glass-card { transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .dark .toggle-inner { transform: translateX(1.5rem); }
    </style>
</head>
<body class="bg-cs-cream dark:bg-cs-dark text-cs-dark dark:text-slate-100 selection:bg-cs-pink selection:text-white overflow-x-hidden">

    <nav class="fixed w-full z-[100] px-4 md:px-8 py-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-b-4 border-cs-lilac/20 rounded-3xl px-6 py-3 shadow-lg transition-all duration-300">
            <div class="flex items-center gap-3 shrink-0">
                <img src="./assets/icons/companylogo.webp" alt="Logo" class="h-10 w-auto" onerror="this.src='https://img.icons8.com/color/96/ribbon.png'">
                <span class="text-xl font-bold tracking-tight gradient-text cute-font hidden sm:block">CuteSense</span>
            </div>
            
            <div class="hidden md:flex items-center gap-8 font-semibold text-sm">
                <a href="./pages/mission.html" class="hover:text-cs-lilac transition-colors">Philosophy</a>
                <a href="./pages/motto.html" class="hover:text-cs-lilac transition-colors">Motto</a>
            </div>

            <div class="flex items-center gap-3 sm:gap-4">
                <a href="https://github.com/CuteSense-Studios" target="_blank" class="flex items-center gap-2 bg-cs-dark dark:bg-cs-lilac text-white px-4 py-2 rounded-full hover:opacity-90 transition-all shadow-md text-sm font-semibold">
                    <span class="hidden sm:inline">Repository</span>
                    <span class="sm:hidden">Repo</span>
                </a>
                <div class="hidden md:flex items-center gap-2 ml-2">
                    <i data-lucide="sun" class="w-4 h-4 opacity-70 text-cs-lilac"></i>
                    <button onclick="toggleThemeManual()" class="relative inline-block w-12 h-6 align-middle select-none transition duration-200 ease-in bg-slate-200 dark:bg-cs-lilac rounded-full p-0">
                        <span class="toggle-inner block w-5 h-5 rounded-full bg-white shadow-sm transition-transform duration-200 ease-in ml-0.5"></span>
                    </button>
                    <i data-lucide="moon" class="w-4 h-4 opacity-70 text-cs-lilac"></i>
                </div>
                <button id="menu-toggle" class="md:hidden p-2 text-cs-lilac ml-1" onclick="toggleMenu()">
                    <i data-lucide="menu"></i>
                </button>
            </div>
        </div>
    </nav>

    <div id="mobile-menu" class="fixed inset-0 z-[110] md:hidden flex flex-col p-10 bg-cs-cream dark:bg-cs-dark transition-all">
        <div class="flex justify-between items-center mb-16">
            <span class="text-3xl font-bold gradient-text cute-font">CuteSense</span>
            <button onclick="toggleMenu()" class="p-3 bg-cs-lilac/10 text-cs-lilac rounded-full">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div class="flex flex-col gap-10 text-2xl font-bold cute-font">
            <a href="./pages/mission.html" onclick="toggleMenu()">Philosophy</a>
            <a href="./pages/motto.html" onclick="toggleMenu()">Motto</a>
        </div>
    </div>

    <section id="hero" class="relative min-h-screen flex items-center justify-center pt-24 overflow-hidden">
        <div class="max-w-5xl mx-auto text-center px-6 relative z-20">
            <div class="mb-10 flex justify-center">
                <div class="floating">
                    <img src="./assets/icons/companylogo.webp" alt="Logo" class="h-40 md:h-56 w-auto object-contain drop-shadow-2xl">
                </div>
            </div>
            <h1 class="text-5xl md:text-8xl font-bold mb-6 leading-tight">
                Quality Art, <br/>
                <span class="gradient-text">Openly Created</span>
            </h1>
            <p class="text-lg md:text-2xl opacity-80 max-w-3xl mx-auto mb-14 font-medium leading-relaxed">
                Empowering creative new voices through high-quality open-source tools and human-AI partnership.
            </p>
            <div class="flex justify-center">
                <a href="./pages/mission.html" class="px-12 py-5 bg-cs-lilac text-white rounded-3xl font-bold text-lg shadow-xl flex items-center gap-2 hover:scale-105 transition-all">
                    Our Mission <i data-lucide="compass"></i>
                </a>
            </div>
        </div>
    </section>

    <footer class="py-24 border-t-4 border-dotted border-cs-lilac/20 px-6 text-center">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-10">
            <div class="flex items-center gap-4">
                <img src="./assets/icons/companylogo.webp" alt="Logo" class="h-12 w-auto">
                <div class="text-left">
                    <span class="text-3xl font-bold gradient-text cute-font block">CuteSense Studios</span>
                    <p class="text-xs font-bold uppercase tracking-[0.2em] text-cs-lilac opacity-80">
                        Art with Heart • © 2026 • built with Gemini
                    </p>
                </div>
            </div>
        </div>
    </footer>

    <script>
        lucide.createIcons();
        function applyTheme(isDark) {
            if (isDark) { document.documentElement.classList.add('dark'); localStorage.setItem('theme', 'dark'); }
            else { document.documentElement.classList.remove('dark'); localStorage.setItem('theme', 'light'); }
            setTimeout(() => lucide.createIcons(), 50);
        }
        window.toggleThemeManual = () => { applyTheme(!document.documentElement.classList.contains('dark')); };
        window.toggleMenu = () => { document.getElementById('mobile-menu').classList.toggle('active'); };
    </script>
</body>
</html>
