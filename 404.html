    <!-- Dynamic Base & Smart GitHub Pages Clean-URL Redirect -->
    <script>
        (function() {
            // 1. Anti-FOUC Theme Detection
            try {
                const s = localStorage.getItem('theme');
                if (s === 'dark' || (!s && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch(e) {}

            // 2. Base Detection for GitHub Pages Subpath vs Custom Domain
            const pathname = window.location.pathname;
            const isRepo = pathname.startsWith('/Official-Website/') || pathname === '/Official-Website';
            const baseHref = isRepo ? '/Official-Website/' : '/';

            // 3. Smart SPA / Clean URL Redirect (e.g. /projects -> pages/projects.html)
            const cleanPath = (isRepo ? pathname.replace(/^\/Official-Website/, '') : pathname).replace(/\/$/, '');
            const cleanLower = cleanPath.toLowerCase();

            const routeMap = {
                '/pages/projects': 'pages/projects.html',
                '/pages/mission': 'pages/mission.html',
                '/pages/motto': 'pages/motto.html',
                '/pages/business-model': 'pages/business-model.html',
                '/pages/buisness-model': 'pages/business-model.html',
                '/pages/buisness-model.html': 'pages/business-model.html',
                '/pages/contributing': 'pages/contributing.html',
                '/pages/code-of-conduct': 'pages/code-of-conduct.html',
                '/projects': 'pages/projects.html',
                '/mission': 'pages/mission.html',
                '/motto': 'pages/motto.html',
                '/business-model': 'pages/business-model.html',
                '/buisness-model': 'pages/business-model.html',
                '/contributing': 'pages/contributing.html',
                '/code-of-conduct': 'pages/code-of-conduct.html',
                '/home': 'index.html'
            };

            const targetPage = routeMap[cleanLower];
            if (targetPage) {
                const destination = baseHref + targetPage + window.location.search + window.location.hash;
                window.location.replace(destination);
                return;
            }

            // If not redirected, write base tag for relative asset loading
            document.write('<base href="' + baseHref + '">');
        })();
    </script>

    <script>
        (function() {
            function initLucide() {
                if (window.lucide) {
                    lucide.createIcons();
                } else {
                    setTimeout(initLucide, 100);
                }
            }
            document.addEventListener('DOMContentLoaded', initLucide);

            const motionMedia = window.matchMedia('(prefers-reduced-motion: reduce)');
            if (!motionMedia.matches) {
                const blobs = document.querySelectorAll('.blob-parallax');
                if (blobs.length) {
                    let ticking = false;
                    blobs.forEach(b => b.style.willChange = 'transform');
                    window.addEventListener('mousemove', (e) => {
                        if (ticking) return;
                        ticking = true;
                        requestAnimationFrame(() => {
                            const x = (e.clientX / window.innerWidth) - 0.5;
                            const y = (e.clientY / window.innerHeight) - 0.5;
                            blobs.forEach((b, i) => {
                                const sp = (i + 1) * 35;
                                b.style.transform = `translate(${x * sp}px, ${y * sp}px)`;
                            });
                            ticking = false;
                        });
                    });
                }
            }
        })();
    </script>
