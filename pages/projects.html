<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Playground | CuteSense Studios</title>
    
    <script src="../assets/js/favicon.js"></script>
    <script src="../assets/js/seo-manager.js" defer></script>
    <script src="../assets/js/lucide.min.js" defer></script>
    <script src="../assets/js/theme.js" defer></script>
    <script src="../assets/js/marked.min.js"></script>

    <link rel="stylesheet" href="../assets/css/tailwind.css">
    <link rel="stylesheet" href="../assets/css/global.css">

    <style>
        .modal-open { overflow: hidden; }
        
        .rounded-brand { border-radius: 4rem; }
        
        .blob-bg { 
            position: absolute; 
            z-index: -10; 
            width: 600px; 
            height: 600px; 
            border-radius: 9999px; 
            filter: blur(140px); 
            opacity: 0.12; 
            pointer-events: none; 
            animation: pulse 3s infinite; 
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* FIX: Search Icon Vertical Centering */
        .search-wrapper { position: relative; width: 100%; display: flex; align-items: center; max-width: 600px; margin: 0 auto; }
        .search-icon-pos { 
            position: absolute; 
            left: 1.75rem; 
            top: 50%; 
            transform: translateY(-50%); 
            pointer-events: none; 
            z-index: 10; 
            display: flex; 
            align-items: center; 
            color: #A178AF; /* Lilac */
            opacity: 0.6;
        }

        .search-input { 
            width: 100%; 
            padding: 1.25rem 1.5rem 1.25rem 4.5rem !important; 
            border-radius: 9999px; 
            background-color: white; 
            border: 4px solid rgba(161, 120, 175, 0.1); /* Lilac border */
            transition: all 0.3s; 
            font-size: 1.05rem;
        }
        .search-input:focus { outline: none; border-color: #D87D85; box-shadow: 0 10px 30px -5px rgba(216, 125, 133, 0.15); }
        .dark .search-input { background-color: #0f172a; border-color: rgba(161, 120, 175, 0.2); color: white; }
    </style>
</head>
<body class="bg-cs-cream dark:bg-cs-dark text-cs-dark dark:text-slate-100 flex flex-col min-h-screen">

    <cs-navbar></cs-navbar>
    <script src="../assets/js/navbar.js"></script>

    <div class="blob-bg top-0 right-0 bg-cs-blue"></div>
    <div class="blob-bg bottom-0 left-0 bg-cs-pink" style="animation-delay: 2s;"></div>

    <main class="flex-grow pt-48 pb-24 px-6 relative">
        <div class="max-w-6xl mx-auto text-center">
            
            <header class="mb-20">
                <div class="inline-block px-5 py-1.5 rounded-full bg-cs-pink/10 text-cs-pink text-[10px] font-black uppercase tracking-[0.3em] mb-6 border border-cs-pink/20">
                    Our Portfolio
                </div>
                <h1 class="text-5xl md:text-8xl font-bold mb-8 leading-tight floating-delayed">
                    Ideas In<span class="hidden md:inline">&nbsp;</span><br class="md:hidden"/> <span class="gradient-text">Full Bloom</span>
                </h1>
                <p class="text-xl md:text-2xl opacity-80 max-w-3xl mx-auto leading-relaxed font-medium reveal">
                    A messy, beautiful collection of code, games, and digital experiments openly created for everyone.
                </p>
            </header>

            <section class="mb-24">
                <div class="search-wrapper">
                    <div class="search-icon-pos">
                        <i data-lucide="search" class="w-6 h-6"></i>
                    </div>
                    <input type="text" id="project-search" placeholder="Filter by vibe or tech..." class="search-input shadow-lg">
                </div>
            </section>

            <div id="projects-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 min-h-[400px]">
                <div class="col-span-full flex flex-col items-center justify-center py-20" id="loader">
                    <i data-lucide="loader" class="animate-spin text-cs-pink w-10 h-10 mb-4"></i>
                    <p class="text-[10px] font-black opacity-40 tracking-widest uppercase">Fetching Wonders...</p>
                </div>
            </div>

            <div id="pagination-container" class="flex justify-center items-center gap-4 mt-20"></div>
        </div>
    </main>

    <div id="modal-overlay" class="fixed inset-0 bg-cs-dark/90 backdrop-blur-xl z-[100] hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4" onclick="if(event.target === this) closeModal()">
        <div id="modal-content" class="bg-cs-cream dark:bg-slate-900 w-full max-w-4xl max-h-[90vh] rounded-brand shadow-2xl border-4 border-cs-pink overflow-hidden flex flex-col transform scale-95 transition-transform duration-500">
            <div class="p-8 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center bg-white/40 dark:bg-white/5">
                <div class="flex items-center gap-4 text-left">
                    <div class="w-12 h-12 rounded-2xl bg-cs-pink text-white flex items-center justify-center shadow-lg">
                        <i data-lucide="box" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <h3 id="modal-title" class="text-2xl font-bold text-cs-dark dark:text-white leading-tight">Project Details</h3>
                        <p class="text-[10px] font-black text-cs-pink uppercase tracking-widest text-left">Open Source Project</p>
                    </div>
                </div>
                <button onclick="closeModal()" class="w-12 h-12 flex items-center justify-center bg-cs-pink/10 hover:bg-cs-pink text-cs-pink hover:text-white rounded-full transition-all">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div id="modal-body" class="p-10 md:p-16 overflow-y-auto markdown-content text-left"></div>
        </div>
    </div>

    <cs-footer></cs-footer>
    <script src="../assets/js/footer.js"></script>

    <script>
        const projectFiles = [
            'as-you-are.md',
        ];

        let allProjects = [];
        let currentPage = 1;
        const itemsPerPage = 6;

        function refreshIcons() { if (window.lucide) { lucide.createIcons(); } }

        async function init() {
            const container = document.getElementById('projects-container');
            try {
                const results = await Promise.allSettled(projectFiles.map(async (file) => {
                    const response = await fetch(`./projects/${file}`);
                    if (!response.ok) throw new Error();
                    const text = await response.text();
                    return parseProject(file, text);
                }));

                allProjects = results.filter(r => r.status === 'fulfilled').map(r => r.value);
                renderUI();

                document.getElementById('project-search').addEventListener('input', (e) => {
                    currentPage = 1;
                    renderUI(e.target.value.toLowerCase());
                });
            } catch (err) {
                container.innerHTML = `<div class="col-span-full w-full flex flex-col items-center justify-center text-center py-20 opacity-50 font-bold">Couldn't load projects. Maybe they're shy?</div>`;
            }
        }

        function parseProject(file, content) {
            const h1 = content.match(/^#\s+(.*)$/m);
            const title = h1 ? h1[1].trim() : file.replace('.md', '').replace(/-/g, ' ');
            const preview = content.replace(/^#.*$/m, '').replace(/[#*`>_]/g, '').replace(/\s+/g, ' ').trim().substring(0, 140) + '...';
            return { title, preview, fullContent: content };
        }

        function renderUI(query = "") {
            const container = document.getElementById('projects-container');
            const filtered = allProjects.filter(p => p.title.toLowerCase().includes(query) || p.fullContent.toLowerCase().includes(query));
            const start = (currentPage - 1) * itemsPerPage;
            const paginated = filtered.slice(start, start + itemsPerPage);
            
            if (paginated.length === 0) {
                // Remove grid classes and force a centered flex layout
                container.className = "flex flex-col items-center justify-center min-h-[400px] w-full";
                container.innerHTML = `
                    <div class="text-center py-20 opacity-40 font-bold">
                        <i data-lucide="search-x" class="w-16 h-16 mx-auto mb-4 text-cs-pink"></i>
                        <p class="text-2xl font-extrabold tracking-tight">No projects found matching your search.</p>
                    </div>`;
                document.getElementById('pagination-container').innerHTML = '';
                refreshIcons();
                return;
            }

            // Put the grid classes back when we have projects to show
            container.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 min-h-[400px]";
            container.innerHTML = paginated.map(p => `
                <div class="glass-card group flex flex-col bg-white/40 dark:bg-slate-800/40 backdrop-blur-sm p-8 rounded-brand border-2 border-transparent hover:border-cs-pink transition-all duration-500 hover:-translate-y-2 text-left shadow-sm">
                    <div class="w-12 h-12 rounded-2xl bg-cs-pink/10 text-cs-pink flex items-center justify-center mb-6 group-hover:bg-cs-pink group-hover:text-white transition-all shrink-0">
                        <i data-lucide="box" class="w-6 h-6"></i>
                    </div>
                    <h4 class="text-xl font-bold mb-2 text-cs-dark dark:text-white capitalize leading-tight line-clamp-2">${p.title}</h4>
                    <p class="text-sm opacity-60 mb-6 leading-relaxed line-clamp-3">${p.preview}</p>
                    <button onclick="openModal('${encodeURIComponent(p.fullContent)}', '${p.title.replace(/'/g, "\\'")}')" class="mt-auto text-cs-pink font-black flex items-center gap-3 hover:gap-5 transition-all text-[11px] uppercase tracking-widest">
                        View Project <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
            `).join('');
            
            renderPagination(Math.ceil(filtered.length / itemsPerPage), query);
            refreshIcons();
        }
        
        function renderPagination(total, query) {
            const container = document.getElementById('pagination-container');
            if (total <= 1) return container.innerHTML = '';
            let btns = `<button onclick="changePage(${currentPage-1},'${query}')" class="w-12 h-12 rounded-full border-2 border-cs-pink/20 flex items-center justify-center ${currentPage===1?'opacity-20 pointer-events-none':''}"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>`;
            for(let i=1; i<=total; i++) btns += `<button onclick="changePage(${i},'${query}')" class="w-12 h-12 rounded-full font-bold transition-all ${i===currentPage?'bg-cs-pink text-white shadow-lg scale-110':'border-2 border-cs-pink/20 hover:border-cs-pink'}">${i}</button>`;
            btns += `<button onclick="changePage(${currentPage+1},'${query}')" class="w-12 h-12 rounded-full border-2 border-cs-pink/20 flex items-center justify-center ${currentPage===total?'opacity-20 pointer-events-none':''}"><i data-lucide="chevron-right" class="w-6 h-6"></i></button>`;
            container.innerHTML = btns;
            refreshIcons();
        }

        window.changePage = (p, q) => { currentPage = p; renderUI(q); window.scrollTo({ top: 0, behavior: 'smooth' }); };

        function openModal(content, title) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = marked.parse(decodeURIComponent(content));
            const o = document.getElementById('modal-overlay');
            o.classList.remove('hidden');
            setTimeout(() => { 
                o.classList.add('opacity-100'); 
                document.getElementById('modal-content').classList.add('scale-100');
                document.body.classList.add('modal-open');
            }, 10);
            if (window.lucide) lucide.createIcons();
        }

        function closeModal() {
            const o = document.getElementById('modal-overlay');
            o.classList.remove('opacity-100');
            document.getElementById('modal-content').classList.remove('scale-100');
            setTimeout(() => { 
                o.classList.add('hidden'); 
                document.body.classList.remove('modal-open');
            }, 300);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
