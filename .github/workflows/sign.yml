name: Auto-Sign Wall
on:
  issues:
    types: [opened, labeled, edited]

jobs:
  update-db:
    if: contains(github.event.issue.labels.*.name, 'signature')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      workflows: write # <--- IMPORTANT: Needed to start other workflows
      
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Update DB
        run: |
          python -c "
          import sqlite3
          import sys
          name = \"${{ github.event.issue.title }}\"
          try:
              conn = sqlite3.connect('./database/signatures.db')
              c = conn.cursor()
              c.execute('INSERT INTO signatures (name) VALUES (?)', (name,))
              conn.commit()
              conn.close()
          except Exception as e:
              print(e)
              sys.exit(1)
          "

      - name: Save to Repo
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          git add database/signatures.db
          git commit -m "Added signature: ${{ github.event.issue.title }}" || echo "No changes"
          git push
          
      - name: Close Issue
        run: gh issue close ${{ github.event.issue.number }} --comment "Signature added! Build started. ✨"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- NEW STEP TO START THE BUILD ---
      - name: Trigger Website Build
        run: gh workflow run build_site.yml # <--- Ensure this filename matches exactly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}