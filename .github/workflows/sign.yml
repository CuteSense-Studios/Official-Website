name: Auto-Sign Wall
on:
  issues:
    types: [opened, labeled, edited]

jobs:
  update-db:
    if: contains(github.event.issue.labels.*.name, 'signature')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      actions: write # <--- FIXED: Use 'actions' to trigger other workflows
      
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Update DB
        run: |
          python -c "
          import sqlite3
          import sys
          import os

          # Using environment variables is safer for names with quotes
          name = os.getenv('ISSUE_TITLE')
          db_path = './database/signatures.db'
          
          try:
              if not os.path.exists(db_path):
                  print(f'Error: {db_path} not found')
                  sys.exit(1)
                  
              conn = sqlite3.connect(db_path)
              c = conn.cursor()
              c.execute('INSERT INTO signatures (name) VALUES (?)', (name,))
              conn.commit()
              conn.close()
              print('Successfully added to DB')
          except Exception as e:
              print(f'Database Error: {e}')
              sys.exit(1)
          "
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}

      - name: Save to Repo
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@github.com"
          git add database/signatures.db
          git commit -m "Added signature: ${{ github.event.issue.title }}" || echo "No changes to commit"
          git push
          
      - name: Close Issue
        run: gh issue close ${{ github.event.issue.number }} --comment "Signature added! Website rebuild triggered. ✨"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Website Build
        # Ensure the filename below matches your build workflow file exactly
        run: gh workflow run build_site.yml 
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}